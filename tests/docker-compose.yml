# Throwaway local database for the test suite. Never points at Neon.
#   docker compose -f tests/docker-compose.yml up -d
#   docker compose -f tests/docker-compose.yml down -v
name: hrm-solution-testdb
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 1s
      timeout: 3s
      retries: 30
  # Speaks Neon's HTTP protocol, so the app's @neondatabase/serverless
  # driver works unchanged.
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports: ["4444:4444"]
    depends_on:
      postgres:
        condition: service_healthy
