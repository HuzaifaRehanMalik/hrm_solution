# CI for the HRM Solution site.
# Runs on every push to main and every pull request. Deploys are handled by
# Vercel's Git integration (preview per PR, production on main), so this
# workflow only has to prove the code is safe to ship.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No DATABASE_URL on purpose: the site must build without secrets.
      - name: Build
        run: npm run build

      # After the build so next-env.d.ts and .next/types exist.
      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  admin-tests:
    name: Admin auth tests (throwaway Postgres)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start test database (Postgres + Neon HTTP proxy)
        run: docker compose -f tests/docker-compose.yml up -d --wait

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run admin auth tests
        run: npm run test:admin

      - name: Database logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs

      - name: Stop test database
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v
